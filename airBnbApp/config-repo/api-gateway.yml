spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/bookings/**
        - id: property-service-public
          uri: lb://property-service
          predicates:
            - Path=/properties/**
        - id: property-service-admin
          uri: lb://property-service
          predicates:
            - Path=/admin/properties/**
        - id: monolith-admin
          uri: lb://airBnbApp
          predicates:
            - Path=/admin/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: booking-service-webhook
          uri: lb://booking-service
          predicates:
            - Path=/webhook/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search/**
