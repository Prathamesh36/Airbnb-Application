    key: ${STRIPE_SECRET_KEY:sk_test_12345}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
