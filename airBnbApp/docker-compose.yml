      context: .
      args:
        - MODULE_PATH=services/notification-service
    container_name: airbnb-notification
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
