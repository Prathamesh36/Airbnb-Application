version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: airbnb-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: airbnb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Distributed Cache / Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: airbnb-redis
    ports:
      - "6379:6379"

  # Event Stream Coordinator
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Message Broker (Kafka) - Remapped host port to 9094 to avoid local 9092 conflicts
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
